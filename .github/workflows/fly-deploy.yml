name: Deploy to Fly.io

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  # ════════════════════════════════════════════
  # 1. Unit tests (Jest)
  #    Quality gate: nothing merges/deploys if backend logic regresses.
  # ════════════════════════════════════════════
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  # ════════════════════════════════════════════
  # 2. End-to-end tests (Playwright + TypeScript, in-repo)
  #    Quality gate: auth, transactions, summary, goals, categories
  #    and a UI health-check must pass against a real, isolated server
  #    instance before anything deploys.
  #    The E2E suite lives in ./e2e and boots its own server on E2E_PORT
  #    with an isolated DATA_DIR, so it never touches prod/dev data.
  # ════════════════════════════════════════════
  e2e-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PateSystem
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install backend dependencies
        run: npm ci

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser (Chromium)
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        run: npm run test:e2e

      - name: Read app version
        id: version
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Upload E2E report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: E2E Tests v${{ steps.version.outputs.version }}
          path: e2e/reports/
          retention-days: 14

  # ════════════════════════════════════════════
  # 3. Bump version and deploy to Fly.io
  #    (only if ALL quality gates pass)
  # ════════════════════════════════════════════
  deploy:
    needs: [unit-tests, e2e-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Bump version
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version patch -m "chore(release): bump v%s [skip ci]"
          echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"
          git push

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
