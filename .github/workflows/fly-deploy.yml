name: Deploy to Fly.io

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  # ════════════════════════════════════════════
  # 1. Unit tests (Jest)
  #    Quality gate: nothing merges/deploys if backend logic regresses.
  # ════════════════════════════════════════════
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  # ════════════════════════════════════════════
  # 2. End-to-end tests (Playwright + Cucumber, in-repo)
  #    Quality gate: the full user lifecycle (register → manage →
  #    summary → delete) plus auth validation must pass against a real,
  #    isolated server instance before anything deploys.
  #    The E2E suite lives in ./e2e and boots its own server on E2E_PORT
  #    with an isolated DATA_DIR, so it never touches prod/dev data.
  # ════════════════════════════════════════════
  e2e-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PateSystem
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install backend dependencies
        run: npm ci

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser (Chromium)
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Start isolated E2E server
        working-directory: e2e
        run: |
          npm run server &
          npx --yes wait-on http://localhost:3001/ --timeout 30000

      - name: Run E2E suite
        working-directory: e2e
        run: npx cross-env E2E_PORT=3001 cucumber-js
        env:
          E2E_PORT: 3001

      - name: Generate HTML report
        working-directory: e2e
        run: npm run report

      - name: Upload E2E report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-cucumber-report
          path: e2e/reports/
          retention-days: 14

  # ════════════════════════════════════════════
  # 3. Deploy to Fly.io (only if ALL quality gates pass)
  # ════════════════════════════════════════════
  deploy:
    needs: [unit-tests, e2e-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
